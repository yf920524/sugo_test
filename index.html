<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<title>トリリオネアを目指せ！ - 物件買い占め経営ゲーム</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ===== タイトル画面 ===== -->
  <section id="startScreen" class="screen">
    <div class="start-card">
      <div class="start-emoji">💰🗾👑</div>
      <h1>トリリオネアを<br>目指せ！</h1>
      <p class="start-sub">本州を旅する物件買い占め経営ゲーム</p>
      <p class="start-desc">本州各地の街を自由に旅して、物件を買い占めよう！<br>都市や地方を完全制覇すると収益が大きくアップ。<br>年間収益<b>1兆円</b>を達成したら「トリリオネア」だ！</p>
      <button id="continueBtn" class="big-btn hidden">▶ 続きから</button>
      <button id="newGameBtn" class="big-btn secondary-btn">🆕 はじめから</button>
      <p class="start-note">1ターン＝1か月、4月はじまり。じっくり会社を育てよう。</p>
    </div>
  </section>

  <!-- ===== ゲーム画面（原則スクロールなしで完結） ===== -->
  <section id="gameScreen" class="screen hidden">

    <!-- ヘッダー：常時表示の主要指標 -->
    <header id="statusBar">
      <div class="date-row">
        <div class="date-chip">第<span id="statYear">1</span>期 <span id="statMonth">4</span>月</div>
        <div class="header-actions">
          <button id="victoryBadge" class="victory-badge hidden" title="トリリオネア達成済み">🏆</button>
          <button id="menuBtn" class="icon-btn-round" title="メニュー">☰</button>
        </div>
      </div>

      <div class="goal-progress">
        <div class="goal-progress-label">
          <span>年間収益</span>
          <span id="statAnnualRevenue" class="goal-progress-value">0円</span>
          <span class="goal-progress-target">/ 1兆円</span>
        </div>
        <div class="goal-bar"><div id="goalBarFill" class="goal-bar-fill"></div></div>
      </div>

      <div class="stat-grid">
        <div class="stat"><span class="stat-icon">💴</span><span id="statCash" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-icon">📊</span><span id="statAssets" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-icon">🏢</span><span id="statProps" class="stat-value">0</span></div>
        <div class="stat"><span class="stat-icon">👑</span><span id="statMonopoly" class="stat-value">0</span></div>
      </div>
    </header>

    <!-- 中央：現在地 -->
    <div id="cityPanel">
      <div id="cityNameRow">
        <span id="cityIcon" class="city-icon">🗼</span>
        <div class="city-text">
          <div id="cityName" class="city-name">東京</div>
          <div id="cityCatch" class="city-catch">日本の首都、大都会！</div>
        </div>
      </div>
      <div id="cityRegionBadge" class="city-region-badge">🗼 関東</div>
    </div>

    <!-- 操作エリア：サイコロ・方向選択 -->
    <div id="controlArea">
      <div id="diceFace">🎲</div>
      <div id="directionButtons" class="direction-buttons"></div>
    </div>

    <!-- 下部：サブ操作 -->
    <nav id="bottomNav">
      <button id="shopBtn" class="nav-btn">🏠<span>物件</span></button>
      <button id="mapBtn" class="nav-btn">🗺️<span>マップ</span></button>
      <button id="collectionBtn" class="nav-btn">🏆<span>コレクション</span></button>
      <button id="logBtn" class="nav-btn">📜<span>ログ</span></button>
    </nav>

  </section>

  <!-- ===== モーダル ===== -->
  <div id="modalRoot" class="modal-overlay hidden">
    <div id="modalBox" class="modal-box"></div>
  </div>

</div>

<script src="save.js"></script>
<script src="data/cities.js"></script>
<script src="data/quiz.js"></script>
<script src="data/combos.js"></script>
<script src="data/events.js"></script>
<script src="game.js"></script>
</body>
</html>
